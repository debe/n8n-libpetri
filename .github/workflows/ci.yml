name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      # Node 24 is `engines.node`'s floor and the version every number in the repo was
      # measured on. It is also the newest the dev tree installs on: `n8n-workflow` pulls
      # `@n8n/expression-runtime` -> `isolated-vm@6.2.0`, whose prebuilds stop at abi137
      # (Node 24), so on Node 26 `npm ci` falls through to `node-gyp rebuild` and dies on
      # `PropertyCallbackInfo<Value>` having no `This()` member. This job ran on '26' from
      # the scaffold commit, which was green only because n8n-workflow was not a dependency
      # yet; it has been red since. Moving up needs isolated-vm >= 7.0.1 (it ships abi147)
      # forced in through an `overrides` entry, which is a change to make deliberately.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      # libpetri shells out to the z3 executable (VER-013). Without it every
      # verification test reports `unknown`, which vitest would count as a pass
      # if the tests merely tolerated it. The gate test in tests/ fails the build
      # when z3 is absent, so proofs cannot quietly become skips.
      - uses: ./.github/actions/install-z3
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
