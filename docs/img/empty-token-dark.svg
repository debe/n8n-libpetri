  <text class="ink fhead" x="798" y="397">IF routes every connected output</text>
  <text class="muted fbody" x="760" y="432">The branch IF did not take emits an <tspan class="accent">empty</tspan> token,</text>
  <text class="muted fbody" x="760" y="454">not nothing. Every edge resolves, always.</text>
