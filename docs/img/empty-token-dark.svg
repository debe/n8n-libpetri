  <text class="ink fhead" x="798" y="321">IF routes every connected output</text>
  <text class="muted fbody" x="760" y="356">The branch IF did not take emits an <tspan class="accent">empty</tspan> token &#8212;</text>
  <text class="muted fbody" x="760" y="378">not nothing. Every edge resolves, always.</text>
