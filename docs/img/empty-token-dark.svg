  <text class="faint note" x="36" y="972">to A: A/in &#183; to B: B/in_empty &#183; from A: in0_e0 &#183; from B: in1_e5_empty &#183; claim slot 0: arm_e0_data &#183; claim slot 1: arm_e5_empty</text>
