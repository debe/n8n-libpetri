<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 507" width="1240" height="507"
     role="img" aria-label="A timeline of the same 13-node n8n workflow run twice. Under n8n’s stack loop the four 2.5 s Code nodes run one after another and the run takes 10,166 ms. On the Petri net at k = 4 the same four run side by side and the run takes 2,672 ms, 3.80 times faster, with identical run data.">
